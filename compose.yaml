services:
  web:
    build: .
    environment:
      PILOT_ADMIN_EMAIL: ${PILOT_ADMIN_EMAIL:-}
      PILOT_INVITES_JSON: ${PILOT_INVITES_JSON:-}
      YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - wagonhub_data:/data
    restart: unless-stopped
volumes:
  wagonhub_data:
