services:
  web:
    build: .
    environment:
      PILOT_ADMIN_EMAILS: ${PILOT_ADMIN_EMAILS:-}
      PILOT_ADMIN_EMAIL: ${PILOT_ADMIN_EMAIL:-}
      PILOT_INVITES_JSON: ${PILOT_INVITES_JSON:-}
      POSTBOX_SMTP_USER: ${POSTBOX_SMTP_USER:-}
      POSTBOX_SMTP_PASSWORD: ${POSTBOX_SMTP_PASSWORD:-}
      RESET_FROM_EMAIL: ${RESET_FROM_EMAIL:-}
      PASSWORD_RESET_SECRET: ${PASSWORD_RESET_SECRET:-}
      YANDEX_METRIKA_ID: ${YANDEX_METRIKA_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - wagonhub_data:/data
    restart: unless-stopped
volumes:
  wagonhub_data:
